openapi: 3.0.0
info:
  title: Beacon API
  version: 1.0.0
  description: |
    Backend API for Beacon.

    Most `/api/*` endpoints require a JWT in `Authorization: Bearer <token>`.
    Request validation is enforced via `express-openapi-validator`.
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: Service health and diagnostics
  - name: Auth
    description: Registration, login, and authentication
  - name: Pins
    description: Map pins (POIs)
  - name: Comments
    description: Comments on pins
  - name: Likes
    description: Like system for pins
  - name: Posts
    description: Community posts
  - name: Share
    description: Public sharing of itineraries
  - name: Trip
    description: Trip planning and routing

paths:
  /heartbeat:
    get:
      tags: [Health]
      summary: Health check endpoint
      description: Returns server status and current timestamp
      operationId: heartbeat
      responses:
        200:
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: integer
                    description: Current server timestamp in milliseconds
                    example: 1737043200000

  /api/pins:
    get:
      tags: [Pins]
      summary: Get all pins
      description: Retrieves all pins from the database
      operationId: getAllPins
      responses:
        200:
          description: Successful response with array of pins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pin'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags: [Pins]
      summary: Create a new pin
      description: Creates a new pin with the provided data
      operationId: createPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  description: Latitude coordinate of the pin
                  example: 40.7128
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Longitude coordinate of the pin
                  example: -74.0060
                title:
                  type: string
                  maxLength: 200
                  description: Title of the pin
                  example: "Golden Gate Overlook"
                description:
                  type: string
                  maxLength: 500
                  description: Description/message content of the pin
                  nullable: true
                image:
                  type: string
                  maxLength: 2000
                  description: URL of the image
                  nullable: true
                address:
                  type: string
                  maxLength: 200
                  description: Address of the pin location
                  nullable: true
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Tags for the pin

      responses:
        201:
          description: Pin created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the newly created pin
        400:
          description: Bad request - missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pins/user:
    get:
      tags: [Pins]
      summary: Get all pins created by the logged-in user
      description: Retrieves all pins created by the authenticated user
      operationId: getUserPins
      responses:
        200:
          description: Successful response with array of user's pins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pin'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pins/nearby:
    post:
      tags: [Pins]
      summary: Get pins near a coordinate
      description: Returns all pins within 10 km of the given latitude/longitude, sorted by distance (closest first), using the Haversine formula for accurate great-circle distance.
      operationId: getPinsNearCoordinate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  description: Latitude of the search origin
                  example: 37.7749
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  description: Longitude of the search origin
                  example: -122.4194
      responses:
        200:
          description: Array of pins within 10 km, sorted nearest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pin'
        400:
          description: Bad request - missing or invalid coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pins/{id}:
    get:
      tags: [Pins]
      summary: Get a specific pin by ID
      description: Retrieves a single pin by its ID
      operationId: getPin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to retrieve
          example: 1
      responses:
        200:
          description: Successful response with pin data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pin'
        400:
          description: Bad request (invalid path parameter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      tags: [Pins]
      summary: Update a specific pin by ID
      description: Updates title/message/image/address for a pin (owner only)
      operationId: updatePin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to update

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                  nullable: true
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                image:
                  type: string
                  maxLength: 2000
                  nullable: true
                address:
                  type: string
                  maxLength: 200
                  nullable: true

      responses:
        200:
          description: Pin updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pin'
        400:
          description: Bad request (invalid body or path parameter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Unauthorized - not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Pin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Pins]
      summary: Delete a specific pin by ID
      description: Delete a single pin by its ID (owner only)
      operationId: deletePin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to delete
      responses:
        200:
          description: Successfully deleted pin
          content: {}
        400:
          description: Bad request (invalid path parameter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Unauthorized - not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Pin not found
          content: {}
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pins/{pinId}/comments:
    get:
      tags: [Comments]
      summary: Get all comments for a pin
      description: Retrieves all comments for a specific pin
      operationId: getPinComments
      parameters:
        - in: path
          name: pinId
          required: true
          schema:
            type: integer
          description: The ID of the pin
      responses:
        200:
          description: Successful response with array of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags: [Comments]
      summary: Create a comment on a pin
      description: Posts a new comment on a specific pin
      operationId: createComment
      parameters:
        - in: path
          name: pinId
          required: true
          schema:
            type: integer
          description: The ID of the pin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  type: string
                  maxLength: 280
                  description: The comment text
      responses:
        201:
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        400:
          description: Bad request - invalid comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Pin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/comments/{commentId}:
    put:
      tags: [Comments]
      summary: Update a comment
      description: Updates a comment (owner only)
      operationId: updateComment
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
          description: The ID of the comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  type: string
                  maxLength: 280
      responses:
        200:
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        400:
          description: Bad request - invalid comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Unauthorized - not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags: [Comments]
      summary: Delete a comment
      description: Deletes a comment (owner only)
      operationId: deleteComment
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
          description: The ID of the comment
      responses:
        200:
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: "Comment deleted successfully"
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Unauthorized - not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Failed to delete comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/login:
    post:
      tags: [Auth]
      summary: User login
      description: Authenticates a user and returns a JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  description: The user's email
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  description: The user's password
                  example: "securepassword"
      responses:
        '200':
          description: Successful login with JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

        '401':
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/register:
    post:
      tags: [Auth]
      summary: User registration
      description: Creates a new user account and returns a JWT token
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  description: The user's email
                  format: email
                  example: "newuser@example.com"
                password:
                  type: string
                  description: The user's password
                  example: "securepassword"
                name:
                  type: string
                  description: The user's display name
                  maxLength: 20
                  example: "John Doe"
      responses:
        '201':
          description: Account created successfully with JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Conflict - email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts:
    get:
      tags: [Posts]
      summary: Get all posts
      description: Retrieves all community posts from the database
      operationId: getAllPosts
      responses:
        200:
          description: Successful response with array of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags: [Posts]
      summary: Create a new post
      description: Creates a new community post with the provided data
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - location
                - message
              properties:
                title:
                  type: string
                  maxLength: 100
                  description: Title of the post
                  example: "Best Coffee Shop"
                location:
                  type: string
                  maxLength: 200
                  description: Location of the place
                  example: "123 Main St, Santa Cruz, CA"
                category:
                  type: string
                  maxLength: 20
                  description: Category of the post
                  example: "Hot"
                  nullable: true
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Tags for the post
                  example: ["Food", "Cafe"]
                message:
                  type: string
                  maxLength: 10000
                  description: Description/message content
                  example: "Amazing espresso and cozy atmosphere!"
                image:
                  type: string
                  maxLength: 2000
                  description: URL of the attached image
                  nullable: true
      responses:
        201:
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        400:
          description: Bad request - missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{id}:
    get:
      tags: [Posts]
      summary: Get a specific post by ID
      description: Retrieves a single post by its ID
      operationId: getPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the post to retrieve
      responses:
        200:
          description: Successful response with post data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      tags: [Posts]
      summary: Update a specific post by ID
      description: Updates a post (owner only)
      operationId: updatePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the post to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                  nullable: true
                location:
                  type: string
                  maxLength: 200
                  nullable: true
                category:
                  type: string
                  maxLength: 20
                  nullable: true
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                message:
                  type: string
                  maxLength: 10000
                  nullable: true
                image:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        200:
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Unauthorized - not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags: [Posts]
      summary: Delete a specific post by ID
      description: Delete a single post by its ID (owner only)
      operationId: deletePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the post to delete
      responses:
        200:
          description: Successfully deleted post
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post deleted successfully"
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Unauthorized - not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{id}/upvote:
    post:
      tags: [Posts]
      summary: Upvote a post
      description: Increment the upvote count for a post
      operationId: upvotePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the post to upvote
      responses:
        200:
          description: Post upvoted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: Already upvoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/likes/{id}:
    get:
      tags: [Likes]
      summary: Get the number of likes on a pin
      description: Retrieves like count and whether the requesting user has liked the pin
      operationId: getLikes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to retrieve
      responses:
        200:
          description: Successful response with like count
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes:
                    type: integer
                    description: Number of likes on the pin
                    example: 42
                  wasLiked:
                    type: boolean
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Pin not found
          content: {}

    post:
      tags: [Likes]
      summary: Like a pin
      description: Adds a like for the requesting user (idempotent per user/pin)
      operationId: addLike
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to like
      responses:
        204:
          description: Like added successfully
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Pin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: Already liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags: [Likes]
      summary: Unlike a pin
      description: Removes the requesting user's like
      operationId: removeLike
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to unlike
      responses:
        204:
          description: Successful response
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Like not found
          content: {}

  /api/share:
    post:
      tags: [Share]
      summary: Share an itinerary
      description: Save an itinerary and get a shareable ID
      operationId: shareItinerary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itinerary
              properties:
                itinerary:
                  type: object
                  description: The complete itinerary data
                itineraryType:
                  type: string
                  description: Type of itinerary
                settings:
                  type: object
                  description: Additional settings
      responses:
        201:
          description: Itinerary shared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Shareable ID
        400:
          description: Missing itinerary data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Failed to share itinerary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/share/{id}:
    get:
      tags: [Share]
      summary: Get a shared itinerary
      description: Retrieve a shared itinerary by ID
      operationId: getSharedItinerary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The shared itinerary ID
      responses:
        200:
          description: Itinerary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedItinerary'
        404:
          description: Itinerary not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Failed to fetch itinerary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trip/plan:
    post:
      tags: [Trip]
      summary: Plan a trip
      description: Generate a sustainable trip plan with transit options and AI itinerary
      operationId: planTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripPlanRequest'
      responses:
        200:
          description: Trip plan generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPlanResponse'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trip/plan/stream:
    post:
      tags: [Trip]
      summary: Plan a trip (streaming)
      description: |
        Streams progress updates using Server-Sent Events (SSE) and ends once options are ready.

        Each frame is sent as: `data: {json}\n\n`.
      operationId: planTripStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripPlanRequest'
      responses:
        200:
          description: SSE stream of progress updates
          content:
            text/event-stream:
              schema:
                type: string

  /api/trip/ask:
    post:
      tags: [Trip]
      summary: Ask a question about the trip
      description: Get AI-powered answers about your trip
      operationId: askTripQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  description: Question to ask
                  example: "What are the best vegetarian restaurants?"
                origin:
                  type: string
                  nullable: true
                destination:
                  type: string
                  nullable: true
                itineraryType:
                  type: string
                  nullable: true
      responses:
        200:
          description: Answer generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trip/generate-itinerary:
    post:
      tags: [Trip]
      summary: Generate itinerary with user selections
      description: Generate a detailed itinerary based on user-selected transit and hotel options
      operationId: generateItinerary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination
                - itineraryType
                - selectedTransit
              properties:
                destination:
                  type: string
                  description: Destination city
                  example: "Los Angeles"
                itineraryType:
                  type: string
                  description: Type of itinerary theme
                  example: "nature"
                durationDays:
                  type: integer
                  description: Trip duration in days
                  example: 3
                selectedTransit:
                  $ref: '#/components/schemas/TransitOption'
                selectedHotel:
                  $ref: '#/components/schemas/EcoHotel'
                localPins:
                  type: array
                  description: Community-recommended local pins to include
                  items:
                    $ref: '#/components/schemas/LocalPin'
      responses:
        200:
          description: Itinerary generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  itinerary:
                    $ref: '#/components/schemas/ItineraryResult'
                  selectedTransit:
                    $ref: '#/components/schemas/TransitOption'
                  selectedHotel:
                    $ref: '#/components/schemas/EcoHotel'
        400:
          description: Bad request - missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trip/local-route:
    post:
      tags: [Trip]
      summary: Get local transit/driving route between coordinates
      description: Returns a route polyline for visualization between two points, trying transit first then falling back to driving
      operationId: getLocalRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [originLat, originLng, destLat, destLng]
                  properties:
                    originLat:
                      type: number
                      description: Origin latitude
                      example: 37.6213
                    originLng:
                      type: number
                      description: Origin longitude
                      example: -122.3790
                    destLat:
                      type: number
                      description: Destination latitude
                      example: 37.7749
                    destLng:
                      type: number
                      description: Destination longitude
                      example: -122.4194
                    departureTime:
                      type: string
                      description: Optional departure time (ISO 8601)
                      example: "2026-02-01T08:00:00Z"
                - type: object
                  required: [originAddress, destAddress]
                  properties:
                    originAddress:
                      type: string
                      description: Origin address or place name
                      example: "SFO Airport"
                    destAddress:
                      type: string
                      description: Destination address or place name
                      example: "Downtown San Francisco"
                    departureTime:
                      type: string
                      description: Optional departure time (ISO 8601)
                      example: "2026-02-01T08:00:00Z"
      responses:
        200:
          description: Route found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRouteResponse'
        400:
          description: Bad request - missing coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: No route found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trip/nearby-pins:
    post:
      tags: [Trip]
      summary: Get nearby pins for selection
      description: Returns nearby pins around a coordinate, prioritizing the requesting user's pins
      operationId: getNearbyPinsForSelection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: number
                  example: 34.0522
                lng:
                  type: number
                  example: -118.2437
                radiusKm:
                  type: number
                  description: Search radius in kilometers
                  example: 50
      responses:
        200:
          description: Pins returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  pins:
                    type: array
                    items:
                      $ref: '#/components/schemas/SelectablePin'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TripPlanRequest:
      type: object
      required:
        - startLocation
        - endLocation
        - itineraryType
      properties:
        startLocation:
          type: string
          description: Starting city or location
          example: "San Francisco"
        endLocation:
          type: string
          description: Destination city or location
          example: "Los Angeles"
        itineraryType:
          type: string
          description: Trip theme
          example: "nature"
        departureDate:
          type: string
          description: Departure date (YYYY-MM-DD)
          example: "2026-02-01"
        durationDays:
          type: integer
          description: Trip duration in days
          example: 3

    TripPlanResponse:
      type: object
      properties:
        origin:
          type: string
        destination:
          type: string
        itineraryType:
          type: string
        transitOptions:
          type: array
          items:
            $ref: '#/components/schemas/TransitOption'
        itinerary:
          $ref: '#/components/schemas/ItineraryResult'
        localPins:
          type: array
          items:
            $ref: '#/components/schemas/LocalPin'
        ecoHotels:
          type: array
          items:
            $ref: '#/components/schemas/EcoHotel'
        carbonStats:
          type: object
          properties:
            bestOption:
              type: object
              properties:
                mode:
                  type: string
                carbonKg:
                  type: number
            worstOption:
              type: object
              properties:
                mode:
                  type: string
                carbonKg:
                  type: number
            typicalTouristKg:
              type: number
            savingsVsTypical:
              type: number
            offsetCostUsd:
              type: number
        routePolylines:
          type: array
          items:
            type: object
            properties:
              mode:
                type: string
              polyline:
                type: string

    LocalRouteResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [transit, driving]
          description: The travel mode used
        polyline:
          type: string
          description: Encoded polyline for the overall route
        duration:
          type: string
          description: Human-readable duration
          example: "45m"
        distanceKm:
          type: number
          description: Distance in kilometers
          example: 12.5
        segments:
          type: array
          description: Present for transit routes; used for multi-colored rendering
          items:
            type: object
            properties:
              lineName:
                type: string
                nullable: true
              polyline:
                type: string
                nullable: true
              departureStop:
                type: string
                nullable: true
              arrivalStop:
                type: string
                nullable: true
              departureLocation:
                type: object
                nullable: true
              arrivalLocation:
                type: object
                nullable: true

    SelectablePin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        latitude:
          type: number
        longitude:
          type: number
        tags:
          type: string
          nullable: true
          description: Tags stored as a JSON-encoded string array
          example: '["food","coffee"]'
        image:
          type: string
          nullable: true
        isUserPin:
          type: boolean
          description: Whether this pin belongs to the requesting user

    Pin:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the pin
          example: 1
        creatorID:
          type: integer
          description: ID of the account that created the pin
          example: 1
        email:
          type: string
          format: email
          description: Email of the pin creator
          example: "user@example.com"
        latitude:
          type: number
          description: self explanatory
        longitude:
          type: number
          description: self explanatory
        title:
          type: string
          maxLength: 200
          description: Title of the pin
          example: "Golden Gate Overlook"
          nullable: true
        description:
          type: string
          maxLength: 500
          description: Description/message content of the pin
          example: "Welcome to Beacon!"
          nullable: true
        image:
          type: string
          maxLength: 2000
          description: URL of the image
          example: "https://images.unsplash.com/photo-1516192518150-0d8fee5425e3"
          nullable: true
        address:
          type: string
          maxLength: 200
          description: Address of the pin location
          example: "123 Main St, San Francisco, CA"
          nullable: true
        tags:
          type: string
          maxLength: 500
          description: Tags stored as a JSON-encoded string array
          example: '["scenic","viewpoint","nature"]'
          nullable: true
        likes:
          type: integer
          description: Base like count stored on the pin
          example: 0
          nullable: true
    
    Comment:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the comment
          example: 1
        pinID:
          type: integer
          description: ID of the pin this comment belongs to
          example: 1
        accountID:
          type: integer
          description: ID of the account that created the comment
          example: 1
        email:
          type: string
          description: Email of the comment author
          example: "user@example.com"
        comment:
          type: string
          maxLength: 280
          description: The comment text
          example: "Great spot!"
        createdAt:
          type: string
          description: Timestamp when the comment was created
          example: "2026-01-17 12:00:00"
    
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message
          example: "Invalid token"
        error:
          oneOf:
            - type: string
            - type: object
          description: Error identifier/message (some endpoints return 'error' instead of 'message')
          example: "Failed to share itinerary"
        errors:
          type: array
          description: Detailed validation errors (OpenAPI validator)
          items:
            type: object
        details:
          type: string
          description: Additional error details
          example: "FOREIGN KEY constraint failed"

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT token for authenticated user
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: integer
              example: 1
            email:
              type: string
              format: email
              example: "user@example.com"
            name:
              type: string
              nullable: true
              example: "Test User"

    Post:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the post
          example: 1
        creatorID:
          type: integer
          description: ID of the account that created the post
          example: 1
          nullable: true
        title:
          type: string
          maxLength: 100
          description: Title of the post
          example: "Best Coffee Shop"
        location:
          type: string
          maxLength: 200
          description: Location of the place
          example: "123 Main St, Santa Cruz, CA"
        category:
          type: string
          maxLength: 20
          description: Category of the post
          example: "Hot"
          nullable: true
        tags:
          type: array
          items:
            type: string
          description: Tags for the post
          example: ["Food", "Cafe"]
        message:
          type: string
          description: Description/message content
          example: "Amazing espresso and cozy atmosphere!"
        image:
          type: string
          maxLength: 2000
          description: URL of the attached image
          nullable: true
        upvotes:
          type: integer
          description: Number of upvotes
          example: 10
        createdAt:
          type: string
          description: Timestamp when the post was created
          example: "2026-01-17 12:00:00"

    TransitOption:
      type: object
      properties:
        mode:
          type: string
          enum: ["flight", "train", "bus", "driving"]
          description: Mode of transportation
          example: "train"
        provider:
          type: string
          description: Transit provider name
          example: "Amtrak"
          nullable: true
        price:
          type: string
          description: Price for the transit option
          example: "$45"
          nullable: true
        duration:
          type: string
          description: Travel duration
          example: "5h 30m"
        carbonKg:
          type: number
          description: Carbon emissions in kilograms
          example: 12.5
        carbonRating:
          type: object
          properties:
            rating:
              type: string
              description: Rating label
              example: "Good"
            color:
              type: string
              description: Color code for the rating
              example: "#22c55e"
            score:
              type: number
              description: Numeric score
              example: 85
        segments:
          type: array
          description: Route segments
          items:
            type: object
          nullable: true
        polyline:
          type: string
          description: Encoded polyline for the route
          nullable: true
        flightNumber:
          type: string
          description: Flight number (for flights)
          example: "UA123"
          nullable: true
        bookingUrl:
          type: string
          description: URL to book this option
          nullable: true

    EcoHotel:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the hotel
          example: "ChIJN1t_tDeuEmsRUsoyG83frY4"
        name:
          type: string
          description: Hotel name
          example: "Green Valley Eco Resort"
        address:
          type: string
          description: Hotel address
          example: "123 Sustainable Way, Los Angeles, CA"
        rating:
          type: number
          description: Hotel rating (1-5)
          example: 4.5
          nullable: true
        userRatingCount:
          type: integer
          description: Number of user ratings
          example: 250
          nullable: true
        priceLevel:
          type: string
          description: Price level indicator
          example: "$$"
          nullable: true
        websiteUri:
          type: string
          description: Hotel website URL
          nullable: true
        googleMapsUri:
          type: string
          description: Google Maps URL
          nullable: true
        editorialSummary:
          type: string
          description: Brief description of the hotel
          nullable: true

    LocalPin:
      type: object
      properties:
        id:
          type: integer
          description: Pin identifier
          example: 1
        title:
          type: string
          description: Pin title
          example: "Hidden Waterfall Trail"
        description:
          type: string
          description: Pin description
          example: "A beautiful secluded waterfall, 20 min hike from parking"
        latitude:
          type: number
          description: Latitude coordinate
          example: 34.0522
        longitude:
          type: number
          description: Longitude coordinate
          example: -118.2437

    ItineraryResult:
      type: object
      properties:
        summary:
          type: string
          description: Brief summary of the itinerary
          example: "A 3-day nature escape exploring Los Angeles' hidden gems"
        days:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryDay'
        sustainabilityTips:
          type: array
          items:
            type: string
          description: Tips for sustainable travel
          example: ["Bring a reusable water bottle", "Use public transit"]
        carbonOffsetSuggestions:
          type: array
          items:
            type: string
          description: Suggestions for carbon offset
          example: ["Consider donating to local reforestation projects"]

    ItineraryDay:
      type: object
      properties:
        day:
          type: integer
          description: Day number
          example: 1
        title:
          type: string
          description: Title for the day
          example: "Exploring Downtown & Nature"
        activities:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
                description: Activity time
                example: "9:00 AM"
              name:
                type: string
                description: Activity name
                example: "Visit Griffith Observatory"
              description:
                type: string
                description: Activity description
                example: "Enjoy panoramic views of LA and learn about space science"
              location:
                type: string
                description: Activity location
                example: "2800 E Observatory Rd, Los Angeles"
                nullable: true
              transportNote:
                type: string
                description: Transportation note
                example: "Take the DASH bus from Hollywood & Highland"
                nullable: true

    SharedItinerary:
      type: object
      properties:
        itinerary:
          type: object
          description: The complete itinerary payload as stored
        itineraryType:
          type: string
          description: Type of itinerary
          example: "adventure"
        settings:
          type: object
          description: Additional settings for the itinerary
        createdAt:
          type: string
          format: date-time
          description: When the itinerary was shared