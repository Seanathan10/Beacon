            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts:
    get:
      tags: [Posts]
      summary: Get all posts
      description: Retrieves all community posts from the database
      operationId: getAllPosts
      responses:
        200:
          description: Successful response with array of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags: [Posts]
      summary: Create a new post
      description: Creates a new community post with the provided data
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - location
                - message
              properties:
                title:
                  type: string
                  maxLength: 100
                  description: Title of the post
                  example: "Best Coffee Shop"
                location:
                  type: string
                  maxLength: 200
                  description: Location of the place
                  example: "123 Main St, Santa Cruz, CA"
                category:
                  type: string
                  maxLength: 20
                  description: Category of the post
                  example: "Hot"
                  nullable: true
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Tags for the post
                  example: ["Food", "Cafe"]
                message:
                  type: string
                  maxLength: 10000
                  description: Description/message content
                  example: "Amazing espresso and cozy atmosphere!"
                image:
                  type: string
                  maxLength: 2000
                  description: URL of the attached image
                  nullable: true
      responses:
        201:
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        400:
          description: Bad request - missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

