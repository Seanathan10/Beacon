        403:
          description: Unauthorized - not the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{id}/upvote:
