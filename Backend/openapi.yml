  /api/likes/{id}:
    get:
      tags: [Likes]
      summary: Get the number of likes on a pin
      description: Retrieves like count and whether the requesting user has liked the pin
      operationId: getLikes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to retrieve
      responses:
        200:
          description: Successful response with like count
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes:
                    type: integer
                    description: Number of likes on the pin
                    example: 42
                  wasLiked:
                    type: boolean
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Pin not found
          content: {}

    post:
      tags: [Likes]
      summary: Like a pin
      description: Adds a like for the requesting user (idempotent per user/pin)
      operationId: addLike
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to like
      responses:
        204:
          description: Like added successfully
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Pin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: Already liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags: [Likes]
      summary: Unlike a pin
      description: Removes the requesting user's like
      operationId: removeLike
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the pin to unlike
      responses:
        204:
          description: Successful response
        401:
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Like not found
          content: {}

